# Serves the dashboard build and proxies the backend.
#   /api/<route>  -> api:8000/<route>   (prefix stripped)
#   /ws/live      -> api:8000/ws/live   (WebSocket upgrade)
# TLS: run certbot on the VM (certbot --nginx is simplest when nginx is on the host;
# with this compose setup use `certbot certonly --webroot` and add the ssl server block).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }


server {
    listen 80;
    server_name pyrosense.us;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pyrosense.us$request_uri;
    }
}

server {
    listen 443 ssl;
  
    server_name pyrosense.us;

    ssl_certificate /etc/letsencrypt/live/pyrosense.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyrosense.us/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;

    # Visitor tracking only runs on the Cloudflare deploy (dashboard/worker/index.ts);
    # here it is accepted and dropped so browsers don't log errors.
    location = /api/track { return 204; }

    location /api/ {

        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Landing page lives in its own folder; without the slash it would fall through to the dashboard.
    location = /landing { return 301 /landing/$is_args$args; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
