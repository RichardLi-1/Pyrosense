# Serves the dashboard build and proxies the backend.
#   /api/<route>  -> api:8000/<route>   (prefix stripped)
#   /ws/live      -> api:8000/ws/live   (WebSocket upgrade)
# TLS: run certbot on the VM (certbot --nginx is simplest when nginx is on the host;
# with this compose setup use `certbot certonly --webroot` and add the ssl server block).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
