# Local dev: just the database.   docker compose -f docker-compose.dev.yml up -d
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - tsdata-dev:/var/lib/postgresql/data
volumes:
  tsdata-dev:
