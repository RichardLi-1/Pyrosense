[project]
name = "hazard-backend"
version = "0.1.0"
description = "PROJECT_NAME backend: Foxglove ingest -> live cache + Tiger Data; REST + /ws/live; alerts; Gemini summary"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "websockets>=12",
  "numpy>=1.26",
  "pillow>=10",
  "mcap-ros2-support>=0.5",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "foxglove-websocket>=0.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
