# Vultr VM deployment. Copy backend/.env.example -> backend/.env first.
#   docker compose up -d --build
#   docker compose exec -T timescaledb psql -U postgres -d app < db/schema.sql
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
    volumes:
      - tsdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/app}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/dist:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  tsdata:
  certbot-etc:
