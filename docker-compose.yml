# Vultr VM deployment. Copy backend/.env.example -> backend/.env first (no inline comments).
#   docker compose up -d --build
# Schema: apply db/schema.sql to whichever database DATABASE_URL points at, e.g.
#   docker compose exec -T timescaledb psql -U postgres -d app < db/schema.sql        (local)
#   docker run --rm -i timescale/timescaledb:latest-pg16 psql "$DATABASE_URL" < db/schema.sql  (Tiger Cloud)
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
    volumes:
      - tsdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    # All settings come from backend/.env. Point DATABASE_URL at Tiger Cloud for the real deployment,
    # or at postgresql://postgres:postgres@timescaledb:5432/app to use the local container below.
    env_file: ./backend/.env
    depends_on:
      timescaledb:
        condition: service_started
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/dist:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  tsdata:
  certbot-etc:
